services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reelinvesting
      POSTGRES_USER: reelinvesting
      POSTGRES_PASSWORD: reelinvesting
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelinvesting"]
      interval: 5s
      timeout: 5s
      retries: 10

  indexer:
    build: ./services/indexer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./services/indexer/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://reelinvesting:reelinvesting@postgres:5432/reelinvesting
    ports:
      - "8000:8000"

volumes:
  postgres_data:
